<style>
/* Importar tipografías de Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Montserrat:wght@400;500;600;700&display=swap');

/* Variables de Diseño (Telat Branding & Tokens) */
:root {
  --telat-celeste: #3284C6;
  --telat-naranja: #EB5B27;
  --telat-amarillo: #FECA66;
  --telat-oscuro: #222221;
  --telat-claro: #FBFBFD;
  --telat-gris-borde: #E3E8EE;
  
  --bg-primary: #F4F6F9;
  --bg-card: #FFFFFF;
  --text-main: #2D3748;
  --text-muted: #718096;
  
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
  
  --font-subheadings: 'DM Sans', sans-serif;
  --font-body: 'Montserrat', sans-serif;
}

/* Reset y Estilos Globales */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
}

/* Layout de Contenedor */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 16px;
}

/* Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: var(--telat-oscuro);
  color: #FFFFFF;
  padding: 14px 20px;
  border-radius: 8px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-md);
}

.header-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-title h1 {
  font-family: var(--font-subheadings);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-title h1 span {
  color: var(--telat-celeste);
}

.header-badge {
  background-color: var(--telat-naranja);
  color: #FFFFFF;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
}

/* Tarjetas de Métricas */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}

.metric-card {
  background-color: var(--bg-card);
  border: 1px solid var(--telat-gris-borde);
  border-radius: 8px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s, box-shadow 0.2s;
}

.metric-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.metric-card.highlight-celeste {
  border-left: 4px solid var(--telat-celeste);
}

.metric-card.highlight-naranja {
  border-left: 4px solid var(--telat-naranja);
}

.metric-card.highlight-amarillo {
  border-left: 4px solid var(--telat-amarillo);
}

.metric-title {
  font-family: var(--font-subheadings);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Uso estricto de font-momo (Impact/Arial Black) solo para métricas numéricas */
.metric-value {
  font-family: 'Impact', 'Arial Black', sans-serif;
  font-size: 26px;
  color: var(--telat-oscuro);
  margin-top: 6px;
  letter-spacing: 0.5px;
}

.metric-value.celeste { color: var(--telat-celeste); }
.metric-value.naranja { color: var(--telat-naranja); }

/* Sección de Control de Filtros */
.controls-bar {
  background-color: var(--bg-card);
  border: 1px solid var(--telat-gris-borde);
  border-radius: 8px;
  padding: 12px 18px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--shadow-sm);
}

.search-filter-group {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-grow: 1;
  max-width: 60%;
}

.search-input {
  flex-grow: 1;
  padding: 8px 12px;
  border: 1px solid var(--telat-gris-borde);
  border-radius: 6px;
  font-family: var(--font-body);
  font-size: 12px;
  outline: none;
}

.search-input:focus {
  border-color: var(--telat-celeste);
}

.filter-select {
  padding: 8px 12px;
  border: 1px solid var(--telat-gris-borde);
  border-radius: 6px;
  font-family: var(--font-body);
  font-size: 12px;
  background-color: #FFFFFF;
  outline: none;
  cursor: pointer;
}

.filter-select:focus {
  border-color: var(--telat-celeste);
}

.actions-group {
  display: flex;
  gap: 8px;
}

/* Botones Premium */
.btn {
  font-family: var(--font-subheadings);
  font-weight: 700;
  font-size: 12px;
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background-color 0.2s, transform 0.1s;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background-color: var(--telat-celeste);
  color: #FFFFFF;
}

.btn-primary:hover {
  background-color: #266FA9;
}

.btn-danger {
  background-color: var(--telat-naranja);
  color: #FFFFFF;
}

.btn-danger:hover {
  background-color: #D34C1D;
}

.btn-secondary {
  background-color: #E2E8F0;
  color: var(--telat-oscuro);
}

.btn-secondary:hover {
  background-color: #CBD5E1;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Área de Tabla y Progreso */
.main-content {
  flex-grow: 1;
  background-color: var(--bg-card);
  border: 1px solid var(--telat-gris-borde);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.progress-banner {
  background-color: #EBF8FF;
  border-bottom: 1px solid #BEE3F8;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
}

.progress-text {
  font-weight: 500;
  color: #2B6CB0;
}

.progress-bar-container {
  width: 250px;
  height: 8px;
  background-color: #E2E8F0;
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background-color: var(--telat-celeste);
  width: 0%;
  transition: width 0.3s;
}

/* Tabla de Contenidos */
.table-container {
  flex-grow: 1;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

thead {
  position: sticky;
  top: 0;
  background-color: #F8FAFC;
  border-bottom: 2px solid var(--telat-gris-borde);
  z-index: 10;
}

th, td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--telat-gris-borde);
}

th {
  font-family: var(--font-subheadings);
  font-weight: 700;
  color: var(--telat-oscuro);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

tbody tr:hover {
  background-color: #F8FAFC;
  cursor: pointer;
}

/* Medallas/Badges de Estados */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
}

.badge-pending { background-color: #EDF2F7; color: #4A5568; }
.badge-analyzing { background-color: #EBF8FF; color: #2B6CB0; }
.badge-eligible { background-color: #C6F6D5; color: #22543D; }
.badge-conserved { background-color: #FEEBC8; color: #744210; }
.badge-no-eligible { background-color: #FED7D7; color: #742A2A; }
.badge-deleted { background-color: #E2E8F0; color: #718096; text-decoration: line-through; }

/* Sección Detalle */
.details-drawer {
  background-color: #F8FAFC;
  border-top: 1px solid var(--telat-gris-borde);
  padding: 14px 20px;
  height: 160px;
  display: flex;
  gap: 20px;
  box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.02);
}

.details-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
}

.details-title {
  font-family: var(--font-subheadings);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  color: var(--telat-celeste);
  margin-bottom: 4px;
}

.details-meta-item {
  font-size: 11px;
}

.details-meta-item strong {
  color: var(--telat-oscuro);
}

/* Loader Inicial */
.loader-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(255, 255, 255, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 20;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #E2E8F0;
  border-top-color: var(--telat-celeste);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loader-overlay p {
  font-family: var(--font-subheadings);
  font-weight: 600;
  color: var(--telat-oscuro);
}
</style>
